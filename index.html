
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Buku Panduan Digital | Kelompok 1A</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f1f3f5;
    }

    header {
      background: #263d55;
      color: white;
      text-align: center;
      padding: 22px 15px;
    }

    header h2 {
      margin: 0 0 8px;
    }

    header p {
      margin: 0;
      font-size: 14px;
    }

    .container {
      max-width: 1100px;
      margin: 20px auto;
      padding: 0 15px;
      text-align: center;
    }

    .pdf-viewer {
      width: 100%;
      height: 80vh;
      border: none;
      background: white;
      border-radius: 8px;
    }

    .download {
      display: inline-block;
      margin: 20px 0;
      padding: 14px 28px;
      background: #263d55;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
    }

    .download:hover {
      background: #385d7e;
    }

    footer {
      text-align: center;
      padding: 15px;
      color: #666;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <header>
    <h2>BUKU PANDUAN DIGITAL</h2>
    <p>Kelompok 1A</p>
  </header>

  <main class="container">

    <iframe
      class="pdf-viewer"
      src="Buku_Panduan_K1A.pdf">
    </iframe>

    <a
      class="download"
      href="Buku_Panduan_K1A.pdf"
      download="Buku_Panduan_K1A.pdf">
      ↓ Download PDF
    </a>

  </main>

  <footer>
    Buku Panduan Digital Kelompok 1A
  </footer>

</body>
</html>
